<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>沖繩伴手禮入境台灣封面</title>
<style>
  :root { --forest:#173f3b; --paper:#f7f8f4; --white:#fff; --ink:#182a2b; --body:#5b6a68; --line:#d7dfd9; --red:#b84c37; --green:#2f6b60; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1600px;background:var(--paper);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink)}
  .sheet{width:1600px;height:900px;display:flex;overflow:hidden}
  .left{width:880px;background:var(--forest);color:var(--white);padding:96px 72px 96px 88px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-size:30px;font-weight:700;letter-spacing:.14em;opacity:.8}
  h1{margin-top:28px;font-size:82px;font-weight:800;line-height:1.2}
  .lede{margin-top:34px;font-size:34px;line-height:1.65;opacity:.9}
  .right{width:720px;padding:88px 76px;display:flex;flex-direction:column;justify-content:center;gap:34px}
  .card{background:var(--white);border-radius:6px;padding:30px 34px;border-left:9px solid var(--red)}
  .card.ok{border-left-color:var(--green)}
  .tag{font-size:27px;font-weight:800;color:var(--red)}
  .card.ok .tag{color:var(--green)}
  .items{margin-top:14px;font-size:33px;font-weight:600;line-height:1.5}
  .sub{margin-top:10px;font-size:25px;color:var(--body);line-height:1.5}
</style>
</head>
<body>
<div class="sheet">
  <div class="left">
    <div class="kicker">沖繩親子旅遊筆記</div>
    <h1>沖繩伴手禮<br>哪些不能帶回台灣</h1>
    <div class="lede">先看有沒有肉、是不是生鮮<br>再決定買不買</div>
  </div>
  <div class="right">
    <div class="card">
      <div class="tag">不能帶</div>
      <div class="items">豬肉製品、生鮮水果、天然珊瑚</div>
      <div class="sub">罰鍰從新臺幣 1 萬元起</div>
    </div>
    <div class="card ok">
      <div class="tag">可以帶</div>
      <div class="items">海帶昆布、紅芋塔、泡盛</div>
      <div class="sub">加工乾燥與烘焙品沒問題</div>
    </div>
  </div>
</div>
</body>
</html>
