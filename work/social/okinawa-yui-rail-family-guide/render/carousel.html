<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>沖繩親子單軌電車輪播</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;padding:78px 86px;display:flex;flex-direction:column;background:linear-gradient(145deg,#082f49,#14617c)}.slide:nth-of-type(2n){background:linear-gradient(145deg,#123e4e,#23788b)}.slide:nth-of-type(3n){background:linear-gradient(145deg,#0b3140,#6b9f9c)}.head{font-size:28px;letter-spacing:.08em;display:flex;justify-content:space-between;border-bottom:2px solid #ffffff44;padding-bottom:28px}.tag{color:#f6d782;font-size:31px;font-weight:bold;letter-spacing:.12em;margin-top:68px}.title{font-size:88px;line-height:1.18;font-weight:800;margin:22px 0 0}.body{font-size:39px;line-height:1.6;color:#e5f0ee;max-width:760px;margin-top:34px}.visual{margin-top:auto;height:405px;border-radius:38px;background:#ffffff12;border:2px solid #ffffff2e;position:relative;overflow:hidden}.rail{position:absolute;left:8%;right:8%;bottom:80px;border-top:16px solid #f6d782}.train{position:absolute;width:670px;height:170px;border-radius:65px 65px 28px 28px;background:#f7f3e7;left:180px;bottom:118px}.train:before{content:"";position:absolute;inset:28px 40px 62px;background:repeating-linear-gradient(90deg,#176079 0 120px,#9ed8d3 120px 170px);border-radius:35px}.wheel{position:absolute;width:62px;height:62px;border-radius:50%;background:#092e40;bottom:84px}.w1{left:310px}.w2{right:310px}.ticket{position:absolute;left:120px;top:60px;width:720px;height:250px;border:3px dashed #f6d782;border-radius:30px;padding:50px;font-size:51px;color:#f6d782}.stroller{position:absolute;left:150px;bottom:54px;width:250px;height:260px;border-left:22px solid #f6d782;border-bottom:22px solid #f6d782;transform:skew(-13deg)}.stroller:after{content:"";position:absolute;width:250px;height:20px;background:#f6d782;left:20px;top:60px}.map{position:absolute;inset:52px;background:linear-gradient(125deg,transparent 42%,#f6d782 43% 47%,transparent 48%),linear-gradient(25deg,transparent 42%,#9ed8d3 43% 47%,transparent 48%)}.map:after{content:"●   ●   ●";position:absolute;bottom:35px;left:160px;color:#fff;font-size:72px;letter-spacing:70px}.check{position:absolute;left:145px;top:50px;font-size:200px;color:#f6d782}.check+div{position:absolute;left:390px;top:120px;font-size:55px;font-weight:bold}.cta{font-size:61px;line-height:1.3;font-weight:800;position:absolute;left:90px;right:90px;bottom:95px}.foot{font-size:25px;opacity:.7;margin-top:35px}.tip{font-size:28px;color:#f6d782;margin-top:20px;font-weight:bold}</style></head><body><script>
const cards=[
['先別急著買一日券','帶孩子搭沖繩單軌，第一步不是選票，而是選今天的移動節奏。','train'],
['先問：今天會開車嗎？','跑北部、海灘或飯店行程，租車通常更順；住那霸、只跑市區，單軌電車才是好隊友。','map'],
['那霸 19 站，不等於 19 個景點','只選一個主要區域，加一個能刪掉的備案。孩子累了，不必把每一站都搭到。','train'],
['票種只看搭乘次數','單程票、一日券、兩日券沒有哪一個必買。先把預計搭的單程加總，再比較。','ticket'],
['推車與行李，電梯也要排進去','全線各站有電梯。先找出口和電梯，再進站；別在閘門前才開始收推車。','stroller'],
['國際通，不必從頭走到底','選一端進場，設一個吃飯或休息點。孩子開始煩躁，就折返搭車。','map'],
['還車日：單軌是備用，不是補救','先遵守租車公司的還車與接駁時間，再把單軌電車排進機場移動。','check'],
['那霸移動三問','今天會不會開車？要搭幾段？孩子需要推車還是午睡？完整攻略在網站。','cta']];
cards.forEach((c,i)=>{const s=document.createElement('section');s.className='slide';s.id='p'+(i+1);let visual=c[2]=='train'?'<div class="rail"></div><div class="train"></div><i class="wheel w1"></i><i class="wheel w2"></i>':c[2]=='ticket'?'<div class="ticket">今天會搭幾段？</div>':c[2]=='stroller'?'<div class="stroller"></div>':c[2]=='map'?'<div class="map"></div>':c[2]=='check'?'<div class="check">✓</div><div>先把還車時間守住</div>':'<div class="cta">先把行程留白，孩子才有餘裕。</div>';s.innerHTML=`<div class="head"><span>OKINAWA FAMILY NOTES</span><span>0${i+1} / 08</span></div><div class="tag">沖繩親子單軌電車</div><div class="title">${c[0]}</div><div class="body">${c[1]}</div><div class="tip">可收藏：先決定路線，再決定票種</div><div class="visual">${visual}</div><div class="foot">okinawafamilynotes.com｜本站自製資訊圖</div>`;document.body.append(s)})
</script></body></html>
