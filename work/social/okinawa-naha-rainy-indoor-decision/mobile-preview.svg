<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Facebook 長文手機預覽：下雨不是把景點全部搬室內</title>
  <desc id="desc">淺灰底的社群貼文手機預覽，包含標題、三段關鍵文案與草稿標記。</desc>
  <rect width="1080" height="1350" fill="#f4f6f8"/>
  <rect x="55" y="48" width="970" height="1254" rx="36" fill="#ffffff"/>
  <circle cx="120" cy="119" r="24" fill="#276c85"/>
  <text x="160" y="111" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="26" fill="#1d2935">Okinawa Family Notes</text>
  <text x="160" y="145" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="20" fill="#6d7780">草稿手機預覽｜未發布</text>
  <line x1="95" y1="180" x2="985" y2="180" stroke="#d9dfe4"/>
  <text x="105" y="270" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="61" font-weight="700" fill="#14212b">下雨不是把景點</text>
  <text x="105" y="345" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="61" font-weight="700" fill="#14212b">全部搬室內</text>
  <text x="105" y="430" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="33" fill="#344552">最累的往往不是雨，而是多了停車、收傘、</text>
  <text x="105" y="478" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="33" fill="#344552">上下車、換衣服和找廁所。</text>
  <rect x="104" y="542" width="870" height="1" fill="#d9dfe4"/>
  <text x="105" y="625" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="39" font-weight="700" fill="#276c85">今天先選一個室內主點</text>
  <text x="105" y="690" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="32" fill="#344552">想看生物、順便吃飯休息 → DMM 水族館</text>
  <text x="105" y="748" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="32" fill="#344552">想留在市區、慢慢看展 → 縣立博物館美術館</text>
  <text x="105" y="806" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="32" fill="#344552">孩子已經累了 → 直接回飯店也可以</text>
  <rect x="104" y="874" width="870" height="1" fill="#d9dfe4"/>
  <text x="105" y="962" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="43" font-weight="700" fill="#14212b">真正要刪掉的，通常是</text>
  <text x="105" y="1022" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="43" font-weight="700" fill="#14212b">第二個主景點。</text>
  <text x="105" y="1130" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="27" fill="#6d7780">此為文案審閱預覽；尚未上傳、排程或發布。</text>
  <text x="105" y="1194" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24" fill="#7f8b93">#沖繩親子旅遊筆記  #沖繩雨天  #那霸親子</text>
  <rect x="105" y="1235" width="173" height="40" rx="20" fill="#e5edf0"/>
  <text x="128" y="1264" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="22" fill="#276c85">審閱中</text>
</svg>
