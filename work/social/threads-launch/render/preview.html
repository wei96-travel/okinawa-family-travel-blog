<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threads 首篇圖卡預覽</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px;
      background: #eef2f1;
      color: #17353b;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    h1 {
      max-width: 1180px;
      margin: 0 auto 24px;
      font-size: 30px;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      max-width: 1180px;
      margin: 0 auto;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      align-items: start;
    }
    figure { margin: 0; }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #cbd7d4;
      background: #ffffff;
    }
    figcaption {
      padding-top: 10px;
      color: #52686c;
      font-size: 16px;
      text-align: center;
    }
    @media (max-width: 820px) {
      body { padding: 16px; }
      .grid { grid-template-columns: 1fr; gap: 28px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <h1>Threads 首篇圖卡｜3 張預覽</h1>
  <div class="grid">
    <figure><img src="01.png?v=2" alt="第一次帶小孩去沖繩，先別急著排景點"><figcaption>第 1 張</figcaption></figure>
    <figure><img src="02.png?v=2" alt="親子行程安排順序"><figcaption>第 2 張</figcaption></figure>
    <figure><img src="03.png?v=2" alt="帶小孩去沖繩，你最擔心哪一件"><figcaption>第 3 張</figcaption></figure>
  </div>
</body>
</html>
