<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threads launch card 2</title>
  <script>if (location.search.includes("capture=1")) document.documentElement.classList.add("capture");</script>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="card flow">
    <p class="eyebrow">親子行程安排順序</p>
    <h1>不是先塞景點，<br>是先留好退路</h1>
    <p class="intro">我會先把容易卡住的地方想好，再決定一天能放幾個點。</p>

    <section class="steps" aria-label="親子行程安排流程">
      <article class="step">
        <span class="step-number">1</span>
        <div><h2>先看航班時間</h2><p>抵達與離境日不要硬塞遠程景點</p></div>
      </article>
      <article class="step">
        <span class="step-number">2</span>
        <div><h2>再確認租車空間</h2><p>推車、汽座和行李能不能一起放</p></div>
      </article>
      <article class="step">
        <span class="step-number">3</span>
        <div><h2>找好廁所與休息點</h2><p>孩子臨時喊累時，才不用一直硬撐</p></div>
      </article>
      <article class="step">
        <span class="step-number">4</span>
        <div><h2>留一個雨天備案</h2><p>下雨時直接換，不必整天重新排</p></div>
      </article>
      <article class="step">
        <span class="step-number">5</span>
        <div><h2>最後才把景點放進去</h2><p>一天少一站，通常反而玩得更完整</p></div>
      </article>
    </section>
    <p class="site-mark">okinawafamilynotes.com</p>
  </main>
</body>
</html>
