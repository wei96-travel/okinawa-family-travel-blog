<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">DMM Kariyushi 水族館親子停留時間 Instagram 預覽</title>
  <desc id="desc">1080 乘以 1350 的淺色資訊圖，提供親子家庭安排 DMM Kariyushi 水族館時間的三種情境。</desc>
  <rect width="1080" height="1350" fill="#eef5f6"/>
  <rect x="48" y="44" width="984" height="1262" rx="42" fill="#ffffff"/>
  <rect x="92" y="86" width="164" height="44" rx="22" fill="#d8edf0"/>
  <text x="119" y="117" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#156579">沖繩親子行程</text>
  <text x="92" y="202" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="58" font-weight="700" fill="#142c38">DMM 水族館要排多久？</text>
  <text x="92" y="278" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="58" font-weight="700" fill="#142c38">親子先抓 1.5～2 小時</text>
  <text x="92" y="340" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="29" fill="#4d626b">不是館方保證時間，是留給看魚、喝水和休息的行程緩衝。</text>
  <rect x="92" y="393" width="896" height="2" fill="#d8e4e7"/>
  <circle cx="150" cy="496" r="37" fill="#156579"/>
  <text x="136" y="508" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">1</text>
  <text x="219" y="486" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="37" font-weight="700" fill="#142c38">只想看動物互動</text>
  <text x="219" y="537" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" fill="#4d626b">孩子精神還好，先抓 1.5 小時</text>
  <rect x="128" y="585" width="824" height="1" fill="#d8e4e7"/>
  <circle cx="150" cy="688" r="37" fill="#f19155"/>
  <text x="136" y="700" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">2</text>
  <text x="219" y="678" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="37" font-weight="700" fill="#142c38">想慢慢看再吃飯</text>
  <text x="219" y="729" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" fill="#4d626b">把周邊商場一起排，抓 2 小時比較不趕</text>
  <rect x="128" y="777" width="824" height="1" fill="#d8e4e7"/>
  <circle cx="150" cy="880" r="37" fill="#7a9b76"/>
  <text x="136" y="892" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">3</text>
  <text x="219" y="870" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="37" font-weight="700" fill="#142c38">孩子已經想睡或煩躁</text>
  <text x="219" y="921" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" fill="#4d626b">不必為了看完再撐一圈，提早離開也可以</text>
  <rect x="92" y="999" width="896" height="190" rx="26" fill="#f4fafb"/>
  <text x="132" y="1061" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="31" font-weight="700" fill="#156579">適合排在：少轉場的室內主行程</text>
  <text x="132" y="1120" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="29" fill="#4d626b">那霸機場開車約 20 分鐘，仍要替塞車留緩衝。</text>
  <text x="92" y="1252" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="25" fill="#72838a">Okinawa Family Notes  |  出發前請再確認當日營業公告</text>
</svg>
