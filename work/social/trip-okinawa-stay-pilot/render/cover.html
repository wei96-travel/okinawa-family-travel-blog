<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>沖繩住宿區 FB 主圖</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #fffdf8;
      background: #162421;
    }
    .cover { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 52% center;
      filter: saturate(.78) contrast(1.03) brightness(.82);
    }
    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(9, 22, 22, .08) 0%, rgba(9, 22, 22, .16) 36%, rgba(9, 22, 22, .86) 76%, rgba(9, 22, 22, .96) 100%);
    }
    .brand {
      position: absolute;
      top: 58px;
      left: 72px;
      padding: 12px 18px;
      border-radius: 6px;
      background: rgba(13, 31, 30, .72);
      backdrop-filter: blur(8px);
      font-size: 27px;
      font-weight: 700;
    }
    .content {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 82px;
    }
    .kicker {
      font-size: 31px;
      line-height: 1.4;
      font-weight: 700;
      color: #f6c66d;
    }
    h1 {
      margin: 18px 0 24px;
      font-size: 91px;
      line-height: 1.14;
      font-weight: 900;
      letter-spacing: 0;
      text-wrap: balance;
    }
    .accent { color: #f6c66d; }
    .sub {
      max-width: 860px;
      font-size: 34px;
      line-height: 1.55;
      font-weight: 600;
      color: rgba(255, 253, 248, .88);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-top: 36px;
      padding-top: 25px;
      border-top: 2px solid rgba(255, 253, 248, .28);
      font-size: 25px;
      font-weight: 700;
      color: rgba(255, 253, 248, .72);
    }
  </style>
</head>
<body>
  <main class="cover">
    <img class="photo" src="../../okinawa-family-driving-pace-guide/coastal-rest-scene-v2.png" alt="">
    <div class="shade"></div>
    <div class="brand">沖繩親子旅遊筆記</div>
    <section class="content">
      <div class="kicker">第一次帶孩子去沖繩</div>
      <h1>住宿區選錯<br><span class="accent">每天都在開車</span></h1>
      <div class="sub">先看班機時間與孩子作息，再決定住哪一區。</div>
      <div class="footer">
        <span>完整整理放在第一則留言</span>
        <span>okinawafamilynotes.com</span>
      </div>
    </section>
  </main>
</body>
</html>
