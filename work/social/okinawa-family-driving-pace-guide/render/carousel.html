<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>親子自駕節奏輪播</title><style>:root{--ink:#fffdf8;--gold:#e8b877;--line:#ffffff2e}*{box-sizing:border-box}body{margin:0;background:#000;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.slide{width:1080px;height:1350px;overflow:hidden;position:relative;padding:78px 86px;color:var(--ink);background:radial-gradient(circle at 88% 16%,#78542e 0 8%,transparent 25%),linear-gradient(145deg,#283d4c,#1c1814 65%)}.top{height:64px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;color:#fffdf8bb;font-size:30px;letter-spacing:1px}.k{margin-top:110px;color:var(--gold);font-size:30px;font-weight:700;letter-spacing:3px}.h1{font-size:94px;line-height:1.13;letter-spacing:-4px;margin:28px 0}.h1 em{font-style:normal;color:var(--gold)}.body{font-size:38px;line-height:1.55;color:#fffdf8e8;max-width:840px}.url{position:absolute;right:86px;bottom:66px;font-size:26px;color:#ffffff90}.visual{position:absolute;left:86px;right:86px;bottom:135px}.cards{display:flex;gap:22px}.card{width:29%;min-height:225px;padding:27px;border:2px solid var(--line);border-radius:26px;background:#ffffff12;font-size:30px;line-height:1.35}.card b{display:block;color:var(--gold);font-size:54px;margin-bottom:18px}.two{font-size:220px;font-weight:800;color:var(--gold);text-align:right;line-height:.7}.two:after{content:"個主行程";display:block;color:var(--ink);font-size:45px;margin-top:36px}.route{height:160px;border:10px solid #42636d;border-radius:100px;transform:rotate(-7deg)}.route:after{content:"";display:block;margin:67px 45px;border-top:10px dashed var(--gold)}.clock{width:280px;height:280px;border:14px solid var(--gold);border-radius:50%;margin-left:auto}.clock:before{content:"";display:block;width:12px;height:110px;background:var(--gold);margin:48px auto}.exit{height:220px;border:2px solid var(--line);border-radius:24px;padding:36px;font-size:42px;color:var(--gold)}.exit:after{content:"回飯店也可以";display:block;color:var(--ink);font-size:52px;margin-top:28px}.check{display:grid;gap:18px}.check div{padding:22px 28px;border:2px solid var(--line);border-radius:18px;font-size:34px}.check b{color:var(--gold)}.cta{border:2px solid var(--gold);border-radius:28px;padding:35px;font-size:43px;color:var(--gold)}@media print{.slide{page-break-after:always}}</style><body><script>const s=new URLSearchParams(location.search).get('slide')||'1';const d={1:['01 / 08','沖繩親子自駕','帶小孩自駕，<br>一天排三個點<br><em>通常更累</em>','不是景點太少，是中間那些事都沒算進去。',''],2:['02 / 08','為什麼會累','地圖 40 分鐘<br>不是全家只花<br><em>40 分鐘</em>','停車、上廁所、綁安全座椅、點餐、收玩具，每一段都會拉長。','cards'],3:['03 / 08','先講結論','一天先留<br><em>兩個</em>主行程','第三站只能是「路過再去」的備案。','two'],4:['04 / 08','做法 1','上午只放<br>最想去的<br><em>一站</em>','把最需要精神的行程放早上。第一站拖延，下午才有空刪。','route'],5:['05 / 08','做法 2','中午<br><em>不排任務</em>','吃飯、廁所、車上午睡都算行程。長途駕駛至少每兩小時休息一次。','clock'],6:['06 / 08','做法 3','下午那站<br>必須可以<br><em>直接刪掉</em>','孩子睡著、天氣變差、停車滿位時，能回飯店就是備案。','exit'],7:['07 / 08','可截圖保存','第三站<br><em>要不要加？</em>','三題都答「是」，才把它加進今天的承諾。','check'],8:['08 / 08','完整內容','兩種不趕路<br>排法都放在<br><em>網站裡</em>','北部重點日、中南部輕鬆日，還有第三站判斷表。','cta']}[s];let v='';if(d[4]=='cards')v='<div class="cards"><div class="card"><b>停車</b>下車不是立刻玩</div><div class="card"><b>尿急</b>先找得到廁所</div><div class="card"><b>午睡</b>不一定能照表</div></div>';if(d[4]=='check')v='<div class="check"><div><b>01</b> 第一站中午前能結束？</div><div><b>02</b> 已留吃飯和休息？</div><div><b>03</b> 錯過也沒關係？</div></div>';if(['two','route','clock','exit','cta'].includes(d[4]))v='<div class="'+d[4]+'"></div>';document.body.innerHTML='<section class="slide"><div class="top"><span>沖繩親子旅遊筆記</span><span>'+d[0]+'</span></div><div class="k">'+d[1]+'</div><h1 class="h1">'+d[2]+'</h1><p class="body">'+d[3]+'</p><div class="visual">'+v+'</div><div class="url">okinawafamilynotes.com</div></section>';</script></body></html>
