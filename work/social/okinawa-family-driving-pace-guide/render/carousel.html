<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沖繩親子自駕輪播</title>
<style>
  :root{--ink:#172b36;--cream:#fff9ef;--sand:#e8bc76;--sea:#2e6d82;--line:#17333f26}
  *{box-sizing:border-box} body{margin:0;background:#111;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
  .slide{width:1080px;height:1350px;overflow:hidden;position:relative;background:var(--cream);color:var(--ink);padding:68px 74px}
  .page{position:absolute;top:70px;right:74px;font:600 25px/1 Arial;letter-spacing:2px;color:#fff}
  .brand{position:absolute;top:72px;left:74px;color:#fff;font-size:27px;letter-spacing:1px}.brand.dark{color:var(--ink)}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#102b3ee8 0%,#102b3ea8 48%,#102b3e12 83%)}
  .cover-copy{position:absolute;left:76px;bottom:112px;width:660px;color:#fff}.eyebrow{font-size:30px;font-weight:800;color:var(--sand);letter-spacing:3px;margin-bottom:24px}.title{font-size:88px;line-height:1.12;letter-spacing:-4px;font-weight:900;margin:0}.title em{font-style:normal;color:var(--sand)}.sub{font-size:34px;line-height:1.55;margin:28px 0 0;color:#fffdf8}
  .kicker{font-size:27px;font-weight:800;letter-spacing:3px;color:#a96826;margin-top:110px}.heading{font-size:76px;line-height:1.14;letter-spacing:-3px;margin:20px 0 24px;max-width:820px}.lead{font-size:34px;line-height:1.55;max-width:800px;color:#38525b}
  .photo-card{position:absolute;left:74px;right:74px;bottom:78px;height:580px;border-radius:34px;overflow:hidden}.photo-card img{width:100%;height:100%;object-fit:cover}.photo-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,#142d3fd9)}.photo-note{position:absolute;z-index:2;left:42px;bottom:38px;color:#fff;font-size:42px;font-weight:800;line-height:1.25}
  .day{position:absolute;left:74px;right:74px;bottom:110px;display:grid;gap:20px}.slot{border-radius:28px;padding:32px 36px;background:#fff;border:2px solid var(--line);display:grid;grid-template-columns:150px 1fr;align-items:center}.slot small{font-size:25px;color:#8c633b;letter-spacing:2px}.slot b{font-size:49px;line-height:1.2}.slot span{font-size:29px;color:#48606a;grid-column:2}
  .route{position:absolute;left:95px;right:95px;bottom:130px;height:560px;border-left:8px dashed var(--sand);padding-left:70px;display:grid;align-content:space-between}.stop{position:relative;background:#fff;border-radius:24px;padding:26px 32px;box-shadow:0 12px 34px #16313d14}.stop:before{content:"";position:absolute;width:28px;height:28px;border:7px solid var(--sea);background:var(--cream);border-radius:50%;left:-88px;top:42px}.stop b{font-size:42px}.stop p{font-size:29px;line-height:1.45;color:#4b626a;margin:10px 0 0}
  .check{position:absolute;left:74px;right:74px;bottom:100px;display:grid;gap:18px}.check div{padding:28px 32px;border-radius:24px;background:#e9f0ef;font-size:37px;font-weight:700}.check b{display:inline-block;width:52px;color:#b56d2e}.cta{position:absolute;left:74px;right:74px;bottom:94px;background:#17333f;border-radius:34px;padding:46px;color:#fff}.cta b{font-size:52px;line-height:1.22;display:block}.cta p{font-size:31px;line-height:1.5;color:#dceced}.url{position:absolute;right:74px;bottom:38px;font:22px Arial;color:#fff9}
</style>
<body><script>
const n=Number(new URLSearchParams(location.search).get('slide')||1);
const coastal='../coastal-rest-scene-v2.png', rest='../rest-stop-scene-v2.png';
const common=(content,dark=false)=>`<div class="slide">${content}<div class="brand ${dark?'dark':''}">沖繩親子旅遊筆記</div><div class="page">${String(n).padStart(2,'0')} / 08</div></div>`;
let out='';
if(n===1)out=common(`<img class="photo" src="${coastal}"><div class="shade"></div><div class="cover-copy"><div class="eyebrow">沖繩親子自駕</div><h1 class="title">一天排三個點<br><em>通常更累</em></h1><p class="sub">不是景點太少，是中間那些事都沒算進去。</p></div><div class="url">okinawafamilynotes.com</div>`);
if(n===2)out=common(`<div class="kicker">為什麼總是趕</div><h2 class="heading">地圖 40 分鐘，<br>不是全家只花<br><span style="color:#b56d2e">40 分鐘</span></h2><p class="lead">停車、上廁所、繫安全座椅、點餐、收玩具，都會把行程拉長。</p><div class="photo-card"><img src="${rest}"><div class="photo-note">把停下來，<br>也算進行程。</div></div>`,true);
if(n===3)out=common(`<div class="kicker">先改一個規則</div><h2 class="heading">一天只留<br><span style="color:#b56d2e">兩個主行程</span></h2><p class="lead">第三個點先放備選。全家狀態好再去，不好就直接略過。</p><div class="day"><div class="slot"><small>上午</small><b>主行程 1</b><span>精神最好的時段，放最想去的地方。</span></div><div class="slot"><small>中間</small><b>午餐＋休息</b><span>不急著找下一站，讓孩子睡、讓大人喘口氣。</span></div><div class="slot"><small>下午</small><b>主行程 2</b><span>只留一件重要的事，結束後就能從容回飯店。</span></div></div>`,true);
if(n===4)out=common(`<div class="kicker">第一站這樣放</div><h2 class="heading">上午去<br>最不想錯過的地方</h2><p class="lead">把最重要的景點放在出發後，別把它壓到孩子最累的下午。</p><div class="route"><div class="stop"><b>出發</b><p>早餐後整隊，先確認水、零食與換洗衣物。</p></div><div class="stop"><b>主行程 1</b><p>到點後別急著趕下一站，留一段真的能玩完的時間。</p></div><div class="stop"><b>午餐／休息</b><p>這段是緩衝，不是「順便再塞一個景點」。</p></div></div>`,true);
if(n===5)out=common(`<div class="kicker">中間這段最值錢</div><h2 class="heading">午餐後<br><span style="color:#b56d2e">先看孩子狀態</span></h2><p class="lead">睡著就讓車程接住午睡；還有精神，再選近一點、好停車的下午行程。</p><div class="photo-card"><img src="${coastal}"><div class="photo-note">不用每次都做滿。<br>舒服回飯店，也算完成。</div></div>`,true);
if(n===6)out=common(`<div class="kicker">下午只做一件事</div><h2 class="heading">第二個主行程<br>選得近一點</h2><p class="lead">把跨區移動留到別天。下午多一段長車程，往往就是情緒爆點。</p><div class="photo-card"><img src="${rest}"><div class="photo-note">看到能安全停車、<br>能休息的地方，就停。</div></div>`,true);
if(n===7)out=common(`<div class="kicker">出門前存這張</div><h2 class="heading">今天的<br>親子自駕檢查</h2><div class="check"><div><b>01</b>只排兩個必去點</div><div><b>02</b>中午保留 1～2 小時彈性</div><div><b>03</b>第三個點可取消，不追進度</div><div><b>04</b>找得到洗手間與停車的位置</div></div>`,true);
if(n===8)out=common(`<div class="kicker">收藏給出發前的自己</div><h2 class="heading">不趕路，<br>才更像旅行。</h2><p class="lead">完整的兩主行程安排、休息節奏與第三點備案，整理在網站文章裡。</p><div class="cta"><b>沖繩親子自駕<br>節奏完整指南</b><p>掃進瀏覽器，出發前再看一次。</p></div>`,true);
document.body.innerHTML=out;
</script></body></html>
