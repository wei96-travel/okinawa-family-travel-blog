<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>沖繩颱風親子旅遊輪播</title>
<style>
:root{--night:#102735;--mist:#e6f0ef;--rain:#7194a0;--warm:#e9b976;--ink:#18313b}*{box-sizing:border-box}body{margin:0;background:#111;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--mist);color:var(--ink);padding:68px 74px}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#082434ed,#082434ae 49%,#08243410 86%)}.brand{position:absolute;top:72px;left:74px;color:#fff;font-size:27px;letter-spacing:1px}.brand.dark{color:var(--ink)}.page{position:absolute;top:70px;right:74px;font:600 25px Arial;letter-spacing:2px;color:#fff}.page.dark{color:var(--ink)}.cover{position:absolute;left:76px;bottom:110px;width:670px;color:#fff}.eyebrow,.kicker{font-size:28px;font-weight:800;letter-spacing:3px;color:var(--warm)}.title{font-size:88px;line-height:1.1;letter-spacing:-4px;margin:24px 0}.title em{font-style:normal;color:var(--warm)}.sub{font-size:34px;line-height:1.55}.kicker{color:#9b6028;margin-top:112px}.heading{font-size:76px;line-height:1.14;letter-spacing:-3px;margin:20px 0 24px;max-width:850px}.lead{font-size:34px;line-height:1.55;color:#425c65;max-width:850px}.image-card{position:absolute;left:74px;right:74px;bottom:80px;height:580px;border-radius:34px;overflow:hidden}.image-card img{width:100%;height:100%;object-fit:cover}.image-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#102735dc)}.note{position:absolute;z-index:2;left:42px;bottom:38px;color:#fff;font-size:40px;font-weight:800;line-height:1.3}.priority{position:absolute;left:74px;right:74px;bottom:100px;display:grid;gap:20px}.item{background:#fff;border-radius:26px;padding:27px 32px;box-shadow:0 12px 32px #17323b14;display:grid;grid-template-columns:100px 1fr}.item b{font-size:51px;color:#b87331}.item strong{font-size:43px}.item p{grid-column:2;font-size:28px;line-height:1.45;color:#50646c;margin:8px 0 0}.split{position:absolute;left:74px;right:74px;bottom:115px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.box{min-height:360px;border-radius:30px;padding:34px;background:#fff}.box b{display:block;font-size:47px;line-height:1.2;margin-bottom:24px}.box p{font-size:30px;line-height:1.48;color:#50646c}.box.safe{background:var(--night);color:#fff}.box.safe p{color:#dae7e7}.list{position:absolute;left:74px;right:74px;bottom:110px;display:grid;gap:18px}.list div{padding:27px 30px;background:#d8e6e6;border-radius:22px;font-size:36px;font-weight:700}.list b{color:#a9632a;display:inline-block;width:60px}.cta{position:absolute;left:74px;right:74px;bottom:94px;background:var(--night);border-radius:34px;padding:46px;color:#fff}.cta b{font-size:52px;line-height:1.2;display:block}.cta p{font-size:31px;line-height:1.5;color:#dcebec}.url{position:absolute;right:74px;bottom:38px;font:22px Arial;color:#fff9}
</style><body><script>
const n=Number(new URLSearchParams(location.search).get('slide')||1),photo='../hotel-rain-scene-v2.png';
const wrap=(x,dark=false)=>`<div class="slide">${x}<div class="brand ${dark?'dark':''}">沖繩親子旅遊筆記</div><div class="page ${dark?'dark':''}">${String(n).padStart(2,'0')} / 08</div></div>`;let out='';
if(n===1)out=wrap(`<img class="photo" src="${photo}"><div class="shade"></div><div class="cover"><div class="eyebrow">沖繩遇到颱風</div><h1 class="title">不要急著<br><em>改景點</em></h1><p class="sub">先把孩子、住宿與交通安定下來。</p></div><div class="url">okinawafamilynotes.com</div>`);
if(n===2)out=wrap(`<div class="kicker">真正會卡住的事</div><h2 class="heading">航班、租車、飯店，<br>還有孩子。</h2><p class="lead">同一時間四件事都要處理，但先後順序比速度更重要。</p><div class="image-card"><img src="${photo}"><div class="note">不需要一邊安撫孩子，<br>一邊把所有行程救回來。</div></div>`,true);
if(n===3)out=wrap(`<div class="kicker">先記這個順序</div><h2 class="heading">颱風天，<br><span style="color:#a9632a">三件事先處理</span></h2><div class="priority"><div class="item"><b>01</b><strong>官方天氣與交通</strong><p>確認氣象、航空或船班、道路與業者公告。</p></div><div class="item"><b>02</b><strong>今晚住哪裡</strong><p>先穩住住宿與下一段移動，再回頭看景點。</p></div><div class="item"><b>03</b><strong>孩子的休息與物品</strong><p>水、食物、充電、替換衣物，比趕行程更實際。</p></div></div>`,true);
if(n===4)out=wrap(`<div class="kicker">第一步別只看雨滴圖</div><h2 class="heading">先看<br>官方公告</h2><p class="lead">一般下雨、強風與警報狀況不同。用氣象台、交通與業者的資訊判斷，別只靠社群傳言。</p><div class="split"><div class="box"><b>一般降雨</b><p>可以調整為室內活動，但保留彈性，不急著一次取消所有安排。</p></div><div class="box safe"><b>強風／警報</b><p>以安全與官方公告為準。這時候不是找替代景點的時候。</p></div></div>`,true);
if(n===5)out=wrap(`<div class="kicker">第二步先保留落腳處</div><h2 class="heading">飯店、租車、<br>下一段住宿</h2><p class="lead">每一家的改期與延長規則不同。直接用訂單上的官方聯絡方式確認，別套用別人的經驗。</p><div class="image-card"><img src="${photo}"><div class="note">先把今晚安頓好，<br>明天才有選擇。</div></div>`,true);
if(n===6)out=wrap(`<div class="kicker">第三步回到孩子身上</div><h2 class="heading">房間裡先備好<br>這四樣</h2><div class="list"><div><b>01</b>喝的水與簡單食物</div><div><b>02</b>已充電的手機與行動電源</div><div><b>03</b>替換衣物、常用藥與雨具</div><div><b>04</b>今晚和明早的基本安排</div></div>`,true);
if(n===7)out=wrap(`<div class="kicker">出發前先收藏</div><h2 class="heading">別把雨天備案，<br>當成颱風對策。</h2><p class="lead">有雨時可以調整；有強風或警報時，先停下來確認官方資訊。兩件事分清楚，才不會越改越亂。</p><div class="split"><div class="box"><b>雨天</b><p>再選室內行程或休息日。</p></div><div class="box safe"><b>颱風</b><p>優先確認安全、交通與住宿。</p></div></div>`,true);
if(n===8)out=wrap(`<div class="kicker">留給出發前的自己</div><h2 class="heading">遇到颱風，<br>先做對下一步。</h2><p class="lead">航班、租車、飯店的確認順序與官方查詢入口，完整整理在網站文章裡。</p><div class="cta"><b>沖繩颱風親子旅遊<br>完整應變指南</b><p>出發前先存起來，遇到變天不用慌。</p></div>`,true);
document.body.innerHTML=out;
</script></body></html>
