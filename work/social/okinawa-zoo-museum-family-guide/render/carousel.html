<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>沖繩兒童王國親子輪播</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;padding:78px 86px;display:flex;flex-direction:column;background:linear-gradient(145deg,#183f35,#347a59)}.slide:nth-of-type(2n){background:linear-gradient(145deg,#1f4e42,#5f9364)}.slide:nth-of-type(3n){background:linear-gradient(145deg,#123d4a,#3e8b8c)}.head{font-size:28px;letter-spacing:.08em;display:flex;justify-content:space-between;border-bottom:2px solid #ffffff44;padding-bottom:28px}.tag{color:#ffdc75;font-size:31px;font-weight:bold;letter-spacing:.12em;margin-top:68px}.title{font-size:84px;line-height:1.18;font-weight:800;margin:22px 0 0}.body{font-size:39px;line-height:1.6;color:#eaf2dc;max-width:780px;margin-top:34px}.visual{margin-top:auto;height:405px;border-radius:38px;background:#ffffff12;border:2px solid #ffffff2e;position:relative;overflow:hidden}.sun{position:absolute;width:150px;height:150px;border-radius:50%;background:#ffdc75;left:120px;top:64px}.cloud{position:absolute;left:330px;top:100px;width:420px;height:150px;background:#dff0e7;border-radius:100px}.cloud:before,.cloud:after{content:"";position:absolute;background:#dff0e7;border-radius:50%}.cloud:before{width:170px;height:170px;left:45px;top:-76px}.cloud:after{width:200px;height:200px;right:35px;top:-100px}.giraffe{position:absolute;right:180px;bottom:30px;width:115px;height:285px;border-radius:65px;background:#f0bd5d}.giraffe:before{content:"";position:absolute;width:215px;height:120px;border-radius:90px 90px 70px 50px;background:#f0bd5d;right:-75px;top:-55px}.giraffe:after{content:"●  ●  ●";white-space:pre;position:absolute;color:#975f31;font-size:48px;top:35px;left:22px;line-height:1.75}.museum{position:absolute;left:145px;right:145px;bottom:55px;height:260px;border-radius:36px 36px 0 0;background:#f2efe0}.museum:before{content:"WONDER";position:absolute;left:115px;top:55px;color:#237174;font-size:61px;font-weight:bold}.museum:after{content:"●   ●   ●";position:absolute;left:110px;bottom:42px;font-size:70px;color:#f0bd5d;letter-spacing:45px}.route{position:absolute;inset:55px;background:linear-gradient(120deg,transparent 44%,#ffdc75 45% 50%,transparent 51%),linear-gradient(25deg,transparent 45%,#c9e9cf 46% 50%,transparent 51%)}.route:after{content:"01   02   03";position:absolute;left:105px;bottom:55px;font-size:62px;color:#fff;letter-spacing:38px}.check{position:absolute;left:145px;top:45px;font-size:220px;color:#ffdc75}.check+div{position:absolute;left:390px;top:120px;font-size:52px;font-weight:bold}.cta{font-size:61px;line-height:1.3;font-weight:800;position:absolute;left:90px;right:90px;bottom:95px}.foot{font-size:25px;opacity:.7;margin-top:35px}.tip{font-size:28px;color:#ffdc75;margin-top:20px;font-weight:bold}</style></head><body><script>
const cards=[
['雨天去動物園，不一定會白跑','沖繩兒童王國有戶外動物區，也有室內神奇博物館。行程能切換，才是親子日的重點。','weather'],
['先把它當一個主行程','孩子還小、從那霸來回，先抓半天或一天的一個重點，不要再塞遠距離景點。','route'],
['三段切著玩','精神好時看動物；吃飯休息；再進室內。留公園區給還有體力的下午。','giraffe'],
['室內館，不是最後才找的備案','神奇博物館適合雨天與炎熱天，但會比園區閉園早 30 分鐘，別拖到最後一刻。','museum'],
['前一晚，確認兩件事','查當日開園與特別活動；票價、動物展示和天候措施都以園方公告為準。','check'],
['推車和停車，也是行程的一段','園方有幼兒設施、哺乳室與數量有限的推車租借。假日停車與走到入口都要留時間。','route'],
['從那霸來回，別再加一個遠景點','一般道路車程、找車位、下車與休息，都比導航上的分鐘數更耗精神。','weather'],
['雨天／炎熱天決策順序','先查公告 → 先排戶外 → 留室內切換 → 孩子累了就縮短。完整攻略在網站。','cta']];
cards.forEach((c,i)=>{const s=document.createElement('section');s.className='slide';s.id='p'+(i+1);let visual=c[2]=='weather'?'<div class="sun"></div><div class="cloud"></div>':c[2]=='giraffe'?'<div class="giraffe"></div>':c[2]=='museum'?'<div class="museum"></div>':c[2]=='route'?'<div class="route"></div>':c[2]=='check'?'<div class="check">✓</div><div>出門前再確認</div>':'<div class="cta">能縮短的行程，才是親子備案。</div>';s.innerHTML=`<div class="head"><span>OKINAWA FAMILY NOTES</span><span>0${i+1} / 08</span></div><div class="tag">沖繩兒童王國</div><div class="title">${c[0]}</div><div class="body">${c[1]}</div><div class="tip">可收藏：室外＋休息＋室內三段節奏</div><div class="visual">${visual}</div><div class="foot">okinawafamilynotes.com｜本站自製資訊圖</div>`;document.body.append(s)})
</script></body></html>
