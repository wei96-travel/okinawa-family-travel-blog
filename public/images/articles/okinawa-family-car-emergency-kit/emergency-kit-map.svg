<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">車上備用包六樣物品</title><desc id="desc">六個圖示說明濕紙巾、夾鏈袋、防水墊、替換衣物、便盆類用品與小垃圾袋，並提醒只在停好車後使用</desc>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="112" y="115" fill="#0f172a" font-family="system-ui, sans-serif" font-size="56" font-weight="800">車上備用包：6 樣就夠用</text><text x="112" y="174" fill="#475569" font-family="system-ui, sans-serif" font-size="29">固定放在大人伸手可及、但不影響駕駛的位置</text>
  <g font-family="system-ui, sans-serif"><g transform="translate(112 245)"><rect width="390" height="220" rx="28" fill="#dbeafe"/><text x="32" y="73" font-size="38" font-weight="800" fill="#1e3a8a">01 濕紙巾</text><text x="32" y="125" font-size="27" fill="#334155">小包、未拆備份</text><rect x="285" y="55" width="65" height="112" rx="11" fill="#fff"/><path d="M296 71h42" stroke="#38bdf8" stroke-width="11"/></g><g transform="translate(605 245)"><rect width="390" height="220" rx="28" fill="#dcfce7"/><text x="32" y="73" font-size="38" font-weight="800" fill="#166534">02 夾鏈袋</text><text x="32" y="125" font-size="27" fill="#334155">濕衣與髒污先密封</text><path d="M282 58h83v110h-83z" fill="#fff" stroke="#22c55e" stroke-width="9"/><path d="M285 82h78" stroke="#22c55e" stroke-width="10"/></g><g transform="translate(1098 245)"><rect width="390" height="220" rx="28" fill="#ffedd5"/><text x="32" y="73" font-size="38" font-weight="800" fill="#9a3412">03 防水墊</text><text x="32" y="125" font-size="27" fill="#334155">保護座椅，不是防漏保證</text><rect x="270" y="65" width="88" height="88" rx="12" fill="#fb923c"/><path d="M283 89h62m-62 28h62" stroke="#fff" stroke-width="9"/></g><g transform="translate(112 530)"><rect width="390" height="220" rx="28" fill="#fce7f3"/><text x="32" y="73" font-size="38" font-weight="800" fill="#9d174d">04 替換衣物</text><text x="32" y="125" font-size="27" fill="#334155">一套就好，依季節換</text><path d="M292 75l35-22 35 22 30 28-27 37-19-16v73h-78v-73l-19 16-27-37z" fill="#f472b6"/></g><g transform="translate(605 530)"><rect width="390" height="220" rx="28" fill="#ede9fe"/><text x="32" y="73" font-size="38" font-weight="800" fill="#5b21b6">05 便盆類用品</text><text x="32" y="125" font-size="27" fill="#334155">先看年齡、承重與清潔</text><path d="M272 139q45-84 92 0v44h-92z" fill="#8b5cf6"/><rect x="250" y="172" width="135" height="25" rx="8" fill="#6d28d9"/></g><g transform="translate(1098 530)"><rect width="390" height="220" rx="28" fill="#e0f2fe"/><text x="32" y="73" font-size="38" font-weight="800" fill="#075985">06 小垃圾袋</text><text x="32" y="125" font-size="27" fill="#334155">到合適地點再整理</text><path d="M286 73h76l17 112H269z" fill="#38bdf8"/><path d="M302 62h43" stroke="#075985" stroke-width="12"/></g></g>
  <rect x="112" y="795" width="1376" height="67" rx="22" fill="#0f172a"/><text x="800" y="840" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="800">重要：行駛中不使用便盆或尿袋；先安全停好車，再處理孩子需求。</text>
</svg>
