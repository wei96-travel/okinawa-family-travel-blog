<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>第一次沖繩住宿輪播審稿預覽</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f4ef; color: #18222b; font-family: "Microsoft JhengHei", system-ui, sans-serif; }
    main { max-width: 1180px; margin: auto; padding: 28px 18px 56px; }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 42px); line-height: 1.25; }
    p { max-width: 760px; margin: 10px 0 24px; color: #52606b; line-height: 1.75; }
    .status { display: inline-block; margin-bottom: 22px; padding: 7px 10px; background: #fff1d6; color: #754800; border-radius: 6px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; overflow: hidden; background: #fff; box-shadow: 0 6px 20px rgba(24,34,43,.08); }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 10px 12px; color: #52606b; font-size: 14px; }
    @media (max-width: 720px) {
      main { padding: 20px 12px 40px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>第一次去沖繩，住哪裡比較順？</h1>
    <p>這是 8 張住宿輪播的審稿頁。手機往下滑可依序查看，確認後才會安排社群發布。</p>
    <span class="status">尚未發布至社群，也不列入 Google 搜尋</span>
    <section class="grid" aria-label="8 張住宿輪播圖">
      <figure><img src="/previews/first-okinawa-where-to-stay-carousel/01.png?v=20260804" alt="第 1 張：第一次去沖繩，住哪裡才不會每天趕"><figcaption>01 / 08</figcaption></figure>
      <figure><img src="/previews/first-okinawa-where-to-stay-carousel/02.png?v=20260804" alt="第 2 張：四天三夜住宿安排"><figcaption>02 / 08</figcaption></figure>
      <figure><img src="/previews/first-okinawa-where-to-stay-carousel/03.png?v=20260804" alt="第 3 張：五天四夜住宿安排"><figcaption>03 / 08</figcaption></figure>
      <figure><img src="/previews/first-okinawa-where-to-stay-carousel/04.png?v=20260804" alt="第 4 張：先看三個區域"><figcaption>04 / 08</figcaption></figure>
      <figure><img src="/previews/first-okinawa-where-to-stay-carousel/05.png?v=20260804" alt="第 5 張：親子住宿別只看房價"><figcaption>05 / 08</figcaption></figure>
      <figure><img src="/previews/first-okinawa-where-to-stay-carousel/06.png?v=20260804" alt="第 6 張：北部排一晚比較輕鬆"><figcaption>06 / 08</figcaption></figure>
      <figure><img src="/previews/first-okinawa-where-to-stay-carousel/07.png?v=20260804" alt="第 7 張：訂房前檢查清單"><figcaption>07 / 08</figcaption></figure>
      <figure><img src="/previews/first-okinawa-where-to-stay-carousel/08.png?v=20260804" alt="第 8 張：完整住宿整理在網站"><figcaption>08 / 08</figcaption></figure>
    </section>
  </main>

</html>
