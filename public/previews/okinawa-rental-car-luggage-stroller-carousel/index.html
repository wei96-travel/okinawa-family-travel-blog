<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>沖繩親子租車行李輪播預覽</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #071f2e; color: #fff; font-family: "Microsoft JhengHei", sans-serif; }
      main { max-width: 1240px; margin: 0 auto; padding: 28px 16px 48px; }
      h1 { font-size: clamp(24px, 4vw, 38px); margin: 0 0 8px; }
      p { color: #dbe6ec; margin: 0 0 28px; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      figure { margin: 0; border-radius: 12px; overflow: hidden; background: #12364a; }
      img { display: block; width: 100%; height: auto; }
      figcaption { padding: 10px 12px; font-size: 14px; color: #dbe6ec; }
      @media (max-width: 680px) { main { padding: 18px 12px 32px; } .grid { grid-template-columns: 1fr; gap: 14px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>沖繩親子租車：行李、推車與汽座</h1>
      <p>8 張輪播公開預覽。手機為單欄、桌機為三欄；每張皆可直接開啟檢視。</p>
      <section class="grid" aria-label="8 張輪播圖">
        <figure><img src="/previews/okinawa-rental-car-luggage-stroller-carousel/01.jpg" alt="第 1 張：後車廂不是魔術箱" /><figcaption>01 / 08</figcaption></figure>
        <figure><img loading="lazy" src="/previews/okinawa-rental-car-luggage-stroller-carousel/02.jpg" alt="第 2 張：先把不會消失的東西列出來" /><figcaption>02 / 08</figcaption></figure>
        <figure><img loading="lazy" src="/previews/okinawa-rental-car-luggage-stroller-carousel/03.jpg" alt="第 3 張：兩張汽座，先想第三排" /><figcaption>03 / 08</figcaption></figure>
        <figure><img loading="lazy" src="/previews/okinawa-rental-car-luggage-stroller-carousel/04.jpg" alt="第 4 張：7 人座不等於行李更多" /><figcaption>04 / 08</figcaption></figure>
        <figure><img loading="lazy" src="/previews/okinawa-rental-car-luggage-stroller-carousel/05.jpg" alt="第 5 張：推車量收折後三個數字" /><figcaption>05 / 08</figcaption></figure>
        <figure><img loading="lazy" src="/previews/okinawa-rental-car-luggage-stroller-carousel/06.jpg" alt="第 6 張：取車現場先試裝 5 分鐘" /><figcaption>06 / 08</figcaption></figure>
        <figure><img loading="lazy" src="/previews/okinawa-rental-car-luggage-stroller-carousel/07.jpg" alt="第 7 張：路上會用的東西別壓最底" /><figcaption>07 / 08</figcaption></figure>
        <figure><img loading="lazy" src="/previews/okinawa-rental-car-luggage-stroller-carousel/08.jpg" alt="第 8 張：收藏這張" /><figcaption>08 / 08</figcaption></figure>
      </section>
    </main>
  </body>
</html>
